<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View thường đọc bảng gốc mỗi lần, materialized view đọc bản lưu</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,400;1,62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">View · view thường và materialized view</p>
    <h1>View thường đọc bảng gốc mỗi lần, materialized view đọc bản lưu</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="view-va-materialized-view-dark-title view-va-materialized-view-dark-desc">
  <title id="view-va-materialized-view-dark-title">View thường và materialized view</title>
  <desc id="view-va-materialized-view-dark-desc">View thường order_totals chỉ lưu câu SELECT: mỗi lần truy vấn, PostgreSQL viết lại thành truy vấn trên bảng gốc orders và order_items nên kết quả luôn mới nhưng không nhanh hơn. Materialized view monthly_revenue chạy truy vấn một lần khi REFRESH và ghi kết quả ra đĩa; truy vấn sau đó đọc bản lưu nên rất nhanh nhưng chỉ mới tới lần REFRESH gần nhất.</desc>

    <marker id="view-va-materialized-view-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>

<rect width="100%" height="100%" fill="#1b1b1d"/>

<text x="720.0" y="286" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Bản lưu kết quả trên đĩa</text>
<text x="720.0" y="304" fill="#b4b9c0" font-size="10.5" font-family="'Geist', sans-serif" text-anchor="middle">22 dòng, tạo index được</text>

<text x="720.0" y="370" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Truy vấn materialized view</text>
<text x="720.0" y="388" fill="#b4b9c0" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">SELECT * FROM monthly_revenue</text>

<text x="720.0" y="436" fill="#b4b9c0" font-size="15" font-family="'Geist', sans-serif" text-anchor="middle">rất nhanh, nhưng chỉ mới tới lần REFRESH gần nhất</text>
