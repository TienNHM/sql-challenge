<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làm sạch customers.city bằng một biểu thức</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,400;1,62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hàm chuỗi · COALESCE · làm sạch dữ liệu</p>
    <h1>Làm sạch customers.city bằng một biểu thức</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lam-sach-city-dark-title lam-sach-city-dark-desc">
  <title id="lam-sach-city-dark-title">Các bước làm sạch cột customers.city</title>
  <desc id="lam-sach-city-dark-desc">Các cách viết 'TP. Hồ Chí Minh', 'Hồ Chí Minh', 'TP.HCM', 'Đà Nẵng', 'đà nẵng' và NULL đi qua TRIM, hai lần REPLACE, INITCAP và COALESCE để thành 'Hồ Chí Minh', 'Đà Nẵng' và 'Chưa rõ'.</desc>
  <defs>
    <marker id="lam-sach-city-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
    <marker id="lam-sach-city-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>
<text x="32" y="44" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">customers.city · GỐC</text>
<text x="304" y="44" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">BIỂU THỨC LÀM SẠCH · CHẠY TỪ TRONG RA NGOÀI</text>
<text x="736" y="44" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">SAU KHI LÀM SẠCH</text>
<rect x="32" y="60" width="208" height="340" rx="8" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.24)" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="736" y="60" width="192" height="340" rx="8" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.24)" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="240" y1="86" x2="304" y2="86" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#lam-sach-city-dark-arrow)"/>
<line x1="484" y1="112" x2="484" y2="132" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#lam-sach-city-dark-arrow)"/>
<line x1="484" y1="184" x2="484" y2="204" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#lam-sach-city-dark-arrow)"/>
<line x1="484" y1="256" x2="484" y2="276" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#lam-sach-city-dark-arrow)"/>
<line x1="484" y1="328" x2="484" y2="348" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#lam-sach-city-dark-arrow)"/>
<line x1="664" y1="374" x2="736" y2="374" stroke="#25c19f" stroke-width="1.2" marker-end="url(#lam-sach-city-dark-arrow-accent)"/>
<rect x="48" y="76" width="176" height="36" rx="4" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="60" y="98" fill="#e3e3e3" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start">'TP. Hồ Chí Minh'</text>
<rect x="48" y="128" width="176" height="36" rx="4" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="60" y="150" fill="#e3e3e3" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start">'Hồ Chí Minh'</text>
<rect x="48" y="180" width="176" height="36" rx="4" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="60" y="202" fill="#e3e3e3" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start">'TP.HCM'</text>
<rect x="48" y="232" width="176" height="36" rx="4" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="60" y="254" fill="#e3e3e3" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start">'Đà Nẵng'</text>
<rect x="48" y="284" width="176" height="36" rx="4" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="60" y="306" fill="#e3e3e3" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start">'đà nẵng'</text>
<rect x="48" y="336" width="176" height="36" rx="4" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="60" y="358" fill="#b4b9c0" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start">NULL</text>
<rect x="304" y="60" width="360" height="52" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<rect x="312" y="68" width="20" height="14" rx="2" fill="none" stroke="#b4b9c0" stroke-width="0.8"/>
<text x="322" y="78" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">1</text>
<text x="342" y="80" fill="#e3e3e3" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start">TRIM(city)</text>
<text x="342" y="98" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">phòng khi có khoảng trắng thừa hai đầu</text>
<rect x="304" y="132" width="360" height="52" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<rect x="312" y="140" width="20" height="14" rx="2" fill="none" stroke="#b4b9c0" stroke-width="0.8"/>
<text x="322" y="150" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">2</text>
<text x="342" y="152" fill="#e3e3e3" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start">REPLACE(…, 'TP.HCM', 'Hồ Chí Minh')</text>
<text x="342" y="170" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">'TP.HCM' → 'Hồ Chí Minh'</text>
<rect x="304" y="204" width="360" height="52" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<rect x="312" y="212" width="20" height="14" rx="2" fill="none" stroke="#b4b9c0" stroke-width="0.8"/>
<text x="322" y="222" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">3</text>
<text x="342" y="224" fill="#e3e3e3" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start">REPLACE(…, 'TP. ', '')</text>
<text x="342" y="242" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">'TP. Hồ Chí Minh' → 'Hồ Chí Minh'</text>
<rect x="304" y="276" width="360" height="52" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<rect x="312" y="284" width="20" height="14" rx="2" fill="none" stroke="#b4b9c0" stroke-width="0.8"/>
<text x="322" y="294" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">4</text>
<text x="342" y="296" fill="#e3e3e3" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start">INITCAP(…)</text>
<text x="342" y="314" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">'đà nẵng' → 'Đà Nẵng'</text>
<rect x="304" y="348" width="360" height="52" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<rect x="312" y="356" width="20" height="14" rx="2" fill="none" stroke="#b4b9c0" stroke-width="0.8"/>
<text x="322" y="366" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">5</text>
<text x="342" y="368" fill="#e3e3e3" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start">COALESCE(…, 'Chưa rõ')</text>
<text x="342" y="386" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">NULL → 'Chưa rõ'</text>
<rect x="752" y="76" width="160" height="36" rx="6" fill="#1b1b1d"/><rect x="752" y="76" width="160" height="36" rx="6" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
<text x="764" y="98" fill="#e3e3e3" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start">'Hồ Chí Minh'</text>
<rect x="752" y="128" width="160" height="36" rx="4" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="764" y="150" fill="#e3e3e3" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start">'Đà Nẵng'</text>
<rect x="752" y="180" width="160" height="36" rx="4" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="764" y="202" fill="#e3e3e3" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start">'Chưa rõ'</text>
<text x="832" y="268" fill="#b4b9c0" font-size="15" font-family="'Geist', sans-serif" text-anchor="middle">10 giá trị khác nhau</text>
<text x="832" y="288" fill="#b4b9c0" font-size="15" font-family="'Geist', sans-serif" text-anchor="middle">còn 7 sau khi làm sạch</text>
<text x="832" y="316" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">(bảng gốc không đổi:</text>
<text x="832" y="332" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">đây chỉ là SELECT)</text>
<text x="480" y="436" fill="#b4b9c0" font-size="15" font-family="'Geist', sans-serif" text-anchor="middle">Thứ tự gọi hàm quan trọng: INITCAP trước REPLACE sẽ biến 'TP.HCM' thành 'Tp.Hcm' và không khớp nữa.</text>
