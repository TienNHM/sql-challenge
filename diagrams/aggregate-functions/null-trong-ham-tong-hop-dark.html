<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hàm tổng hợp bỏ qua NULL</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,400;1,62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Hàm tổng hợp · NULL · COUNT · AVG</p>
    <h1>Hàm tổng hợp bỏ qua NULL</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 372" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="null-trong-ham-tong-hop-dark-title null-trong-ham-tong-hop-dark-desc">
  <title id="null-trong-ham-tong-hop-dark-title">NULL trong hàm tổng hợp</title>
  <desc id="null-trong-ham-tong-hop-dark-desc">Ba laptop văn phòng có cost_price 16.000.000, 22.000.000 và NULL: COUNT(*) bằng 3, COUNT(cost_price) bằng 2, SUM bằng 38.000.000, AVG bằng 19.000.000 vì chỉ chia cho 2 dòng có giá trị; nếu coi NULL là 0 bằng COALESCE thì trung bình là 12.666.667.</desc>
  <defs>
    <marker id="null-trong-ham-tong-hop-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>
<text x="32" y="108" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">BẢNG PRODUCTS · CATEGORY_ID = 4</text>
<line x1="416" y1="192" x2="470" y2="192" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#null-trong-ham-tong-hop-dark-arrow)"/>
<rect x="32" y="122" width="384" height="140" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1" />
<rect x="33" y="123" width="382" height="31" rx="5" fill="rgba(227,227,227,0.03)" stroke="none"/>
<line x1="32" y1="154" x2="416" y2="154" stroke="rgba(227,227,227,0.10)" stroke-width="1"/>
<line x1="32" y1="190" x2="416" y2="190" stroke="rgba(227,227,227,0.10)" stroke-width="1"/>
<line x1="32" y1="226" x2="416" y2="226" stroke="rgba(227,227,227,0.10)" stroke-width="1"/>
<line x1="128" y1="122" x2="128" y2="262" stroke="rgba(227,227,227,0.10)" stroke-width="1"/>
<line x1="296" y1="122" x2="296" y2="262" stroke="rgba(227,227,227,0.10)" stroke-width="1"/>
<text x="44" y="142" fill="#b4b9c0" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="500">sku</text>
<text x="140" y="142" fill="#b4b9c0" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="500">name</text>
<text x="404" y="142" fill="#b4b9c0" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" font-weight="500">cost_price</text>
<text x="44" y="176" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" >LAP-004</text>
<text x="140" y="176" fill="#e3e3e3" font-size="11" font-family="'Geist', sans-serif" text-anchor="start" >Dell Inspiron 14</text>
<text x="404" y="176" fill="#e3e3e3" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end" >16.000.000</text>
<text x="44" y="212" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" >LAP-005</text>
<text x="140" y="212" fill="#e3e3e3" font-size="11" font-family="'Geist', sans-serif" text-anchor="start" >MacBook Air M2 13 inch</text>
<text x="404" y="212" fill="#e3e3e3" font-size="11" font-family="'Geist Mono', monospace" text-anchor="end" >22.000.000</text>
<text x="44" y="248" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start" >LAP-006</text>
<text x="140" y="248" fill="#e3e3e3" font-size="11" font-family="'Geist', sans-serif" text-anchor="start" >HP Pavilion 15</text>
<rect x="304" y="232" width="104" height="24" rx="4" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1" />
<text x="356" y="248" fill="#25c19f" font-size="11" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">NULL</text>
<text x="224" y="296" fill="#b4b9c0" font-size="15" font-family="'Geist', sans-serif" text-anchor="middle" >NULL là “chưa biết”, không phải 0.</text>
<text x="224" y="318" fill="#b4b9c0" font-size="15" font-family="'Geist', sans-serif" text-anchor="middle" >Hàm tổng hợp bỏ qua nó, trừ COUNT(*).</text>
<rect x="472" y="52" width="456" height="284" rx="8" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.24)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="488" y="72" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">KẾT QUẢ CỦA TỪNG HÀM</text>
<rect x="488" y="84" width="424" height="40" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1" />
<text x="504" y="101" fill="#e3e3e3" font-size="11" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="500">COUNT(*)</text>
<text x="504" y="116" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start" >đếm mọi dòng, kể cả dòng NULL</text>
<text x="896" y="109" fill="#e3e3e3" font-size="14" font-family="'Geist', sans-serif" text-anchor="end" font-weight="600">3</text>
<rect x="488" y="132" width="424" height="40" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1" />
<text x="504" y="149" fill="#e3e3e3" font-size="11" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="500">COUNT(cost_price)</text>
<text x="504" y="164" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start" >chỉ đếm dòng có giá trị</text>
<text x="896" y="157" fill="#e3e3e3" font-size="14" font-family="'Geist', sans-serif" text-anchor="end" font-weight="600">2</text>
<rect x="488" y="180" width="424" height="40" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1" />
<text x="504" y="197" fill="#e3e3e3" font-size="11" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="500">SUM(cost_price)</text>
<text x="504" y="212" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start" >cộng các giá trị khác NULL</text>
<text x="896" y="205" fill="#e3e3e3" font-size="14" font-family="'Geist', sans-serif" text-anchor="end" font-weight="600">38.000.000</text>
<rect x="488" y="228" width="424" height="40" rx="6" fill="#1b1b1d" stroke="none" stroke-width="0" />
<rect x="488" y="228" width="424" height="40" rx="6" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1" />
<text x="504" y="245" fill="#e3e3e3" font-size="11" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="500">AVG(cost_price)</text>
<text x="504" y="260" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start" >= 38.000.000 / 2, bỏ qua NULL</text>
<text x="896" y="253" fill="#25c19f" font-size="14" font-family="'Geist', sans-serif" text-anchor="end" font-weight="600">19.000.000</text>
<rect x="488" y="276" width="424" height="40" rx="6" fill="#242526" stroke="#b4b9c0" stroke-width="1" stroke-dasharray="5,4"/>
<text x="504" y="293" fill="#e3e3e3" font-size="11" font-family="'Geist Mono', monospace" text-anchor="start" font-weight="500">AVG(COALESCE(cost_price, 0))</text>
<text x="504" y="308" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start" >coi NULL là 0: 38.000.000 / 3</text>
<text x="896" y="301" fill="#b4b9c0" font-size="14" font-family="'Geist', sans-serif" text-anchor="end" font-weight="600">12.666.667</text>
<text id="tiennhm-copyright" x="936" y="360" text-anchor="end" fill="#b4b9c0" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
