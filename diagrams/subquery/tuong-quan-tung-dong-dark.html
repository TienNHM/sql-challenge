<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truy vấn con tương quan chạy lại cho từng dòng</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,400;1,62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Subquery tương quan · products</p>
    <h1>Truy vấn con tương quan chạy lại cho từng dòng</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 464" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tuong-quan-tung-dong-dark-title tuong-quan-tung-dong-dark-desc">
  <title id="tuong-quan-tung-dong-dark-title">Subquery tương quan chạy theo từng dòng của products</title>
  <desc id="tuong-quan-tung-dong-dark-desc">Với mỗi dòng của products, truy vấn con AVG(price) được tính lại với category_id của dòng đó: ASUS ROG (danh mục 3, 32.990.000 &gt; 28.323.333) được giữ, Acer Nitro V 15 (21.990.000 &lt; 28.323.333) bị bỏ, iPhone 15 (danh mục 7, 19.990.000 &gt; 11.140.000) được giữ; còn truy vấn con không tương quan chỉ tính một lần.</desc>
  <defs>
    <marker id="tuong-quan-tung-dong-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
    <marker id="tuong-quan-tung-dong-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>
<text x="32" y="40" fill="#e3e3e3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">SELECT sku, price FROM products p WHERE p.price &gt; (SELECT AVG(p2.price) FROM products p2 WHERE p2.category_id = p.category_id)</text>
<text x="32" y="76" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">1 · DÒNG CỦA TRUY VẤN NGOÀI</text>
<text x="320" y="76" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">2 · TRUY VẤN CON CHẠY LẠI VỚI GIÁ TRỊ CỦA DÒNG ĐÓ</text>
<text x="680" y="76" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">3 · WHERE SO SÁNH</text>
<line x1="272" y1="124" x2="320" y2="124" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#tuong-quan-tung-dong-dark-arrow)"/>
<line x1="632" y1="124" x2="680" y2="124" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#tuong-quan-tung-dong-dark-arrow)"/>
<line x1="272" y1="208" x2="320" y2="208" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#tuong-quan-tung-dong-dark-arrow)"/>
<line x1="632" y1="208" x2="680" y2="208" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#tuong-quan-tung-dong-dark-arrow)"/>
<line x1="272" y1="292" x2="320" y2="292" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#tuong-quan-tung-dong-dark-arrow)"/>
<line x1="632" y1="292" x2="680" y2="292" stroke="#b4b9c0" stroke-width="1.2" marker-end="url(#tuong-quan-tung-dong-dark-arrow)"/>
<rect x="32" y="92" width="240" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="48" y="116" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">LAP-001 · ASUS ROG Strix G16</text>
<text x="48" y="136" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">category_id = 3 · price 32.990.000</text>
<rect x="320" y="92" width="312" height="64" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="336" y="116" fill="#e3e3e3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">SELECT AVG(p2.price) … WHERE</text>
<text x="336" y="132" fill="#e3e3e3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">p2.category_id = 3</text>
<text x="616" y="132" fill="#e3e3e3" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">→ 28.323.333</text>
<rect x="680" y="92" width="248" height="64" rx="6" fill="#1b1b1d" stroke="none" stroke-width="0"/>
<rect x="680" y="92" width="248" height="64" rx="6" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
<text x="696" y="116" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start">32.990.000 &gt; 28.323.333</text>
<text x="696" y="136" fill="#25c19f" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">TRUE → giữ dòng</text>
<rect x="32" y="176" width="240" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="48" y="200" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">LAP-003 · Acer Nitro V 15</text>
<text x="48" y="220" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">category_id = 3 · price 21.990.000</text>
<rect x="320" y="176" width="312" height="64" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="336" y="200" fill="#e3e3e3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">SELECT AVG(p2.price) … WHERE</text>
<text x="336" y="216" fill="#e3e3e3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">p2.category_id = 3</text>
<text x="616" y="216" fill="#e3e3e3" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">→ 28.323.333</text>
<rect x="680" y="176" width="248" height="64" rx="6" fill="#242526" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="696" y="200" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start">21.990.000 &lt; 28.323.333</text>
<text x="696" y="220" fill="#b4b9c0" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">FALSE → bỏ dòng</text>
<rect x="32" y="260" width="240" height="64" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="48" y="284" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">PHN-001 · iPhone 15 128GB</text>
<text x="48" y="304" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">category_id = 7 · price 19.990.000</text>
<rect x="320" y="260" width="312" height="64" rx="6" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.30)" stroke-width="1"/>
<text x="336" y="284" fill="#e3e3e3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">SELECT AVG(p2.price) … WHERE</text>
<text x="336" y="300" fill="#e3e3e3" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">p2.category_id = 7</text>
<text x="616" y="300" fill="#e3e3e3" font-size="10" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">→ 11.140.000</text>
<rect x="680" y="260" width="248" height="64" rx="6" fill="#1b1b1d" stroke="none" stroke-width="0"/>
<rect x="680" y="260" width="248" height="64" rx="6" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
<text x="696" y="284" fill="#e3e3e3" font-size="10" font-family="'Geist Mono', monospace" text-anchor="start">19.990.000 &gt; 11.140.000</text>
<text x="696" y="304" fill="#25c19f" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="start">TRUE → giữ dòng</text>
<text x="32" y="352" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="start">… và cứ thế cho cả 24 dòng của products: mỗi dòng ngoài, truy vấn con được tính lại một lần (về mặt logic).</text>
<line x1="32" y1="372" x2="928" y2="372" stroke="rgba(227,227,227,0.10)" stroke-width="1"/>
<text x="32" y="398" fill="#b4b9c0" font-size="15" font-family="'Geist', sans-serif" text-anchor="start">So sánh: WHERE price &gt; (SELECT AVG(price) FROM products) không nhắc tới cột nào của dòng ngoài,</text>
<text x="32" y="420" fill="#b4b9c0" font-size="15" font-family="'Geist', sans-serif" text-anchor="start">nên chỉ cần tính một lần (10.832.875) rồi dùng cho mọi dòng.</text>
<text id="tiennhm-copyright" x="936" y="452" text-anchor="end" fill="#b4b9c0" opacity="0.75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">© tiennhm</text>
</svg>
    </div>
  </div>
</body>
</html>
