<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Một câu INSERT đi qua các trigger theo thứ tự nào</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wdth,wght@0,62.5..100,400;1,62.5..100,400&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #1b1b1d;
      --color-ink:    #e3e3e3;
      --color-muted:  #b4b9c0;
      --font-sans:    'Geist', system-ui, sans-serif;
      /* Instrument Serif has no Vietnamese subset; a per-glyph fallback mixes two faces
         inside one word, so Vietnamese titles swap the whole face instead. */
      --font-serif:   'Noto Serif Display', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em;
               text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-stretch: 75%; font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Ngày 18 · Trigger · BEFORE và AFTER</p>
    <h1>Một câu INSERT đi qua các trigger theo thứ tự nào</h1>
    <div class="diagram-container">
<svg viewBox="0 0 960 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="luong-trigger-insert-dark-title luong-trigger-insert-dark-desc">
  <title id="luong-trigger-insert-dark-title">Thứ tự chạy trigger quanh một câu INSERT vào order_items</title>
  <desc id="luong-trigger-insert-dark-desc">Câu INSERT hai dòng vào order_items chạy BEFORE STATEMENT một lần, rồi với từng dòng chạy BEFORE ROW (điền unit_price, có thể sửa NEW) và ghi dòng kèm kiểm tra ràng buộc, sau khi ghi xong mọi dòng thì chạy AFTER ROW cho từng dòng (trừ tồn kho) và cuối cùng AFTER STATEMENT một lần; lỗi ở bất kỳ bước nào hủy cả câu lệnh.</desc>
  <defs>
    <marker id="luong-trigger-insert-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b4b9c0"/></marker>
    <marker id="luong-trigger-insert-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#25c19f"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#1b1b1d"/>
<text x="32" y="40" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">CÂU LỆNH</text>

<text x="480" y="72" fill="#e3e3e3" font-size="11" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">INSERT INTO order_items (order_id, product_id, quantity) VALUES (41, 16, 2), (41, 22, 1);</text>
<rect x="206" y="120" width="362" height="144" rx="8" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.24)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="218" y="138" fill="#b4b9c0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.18em">LẶP CHO TỪNG DÒNG</text>
<rect x="578" y="120" width="176" height="144" rx="8" fill="rgba(227,227,227,0.03)" stroke="rgba(227,227,227,0.24)" stroke-width="1" stroke-dasharray="4,3"/>

<rect x="32" y="160" width="152" height="88" rx="6" fill="#1b1b1d" stroke="#b4b9c0" stroke-width="1" stroke-dasharray="4,3"/>
<text x="108.0" y="190" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BEFORE STATEMENT</text>
<text x="108.0" y="210" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chạy 1 lần</text>

<rect x="218" y="160" width="152" height="88" rx="6" fill="#1b1b1d"/><rect x="218" y="160" width="152" height="88" rx="6" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>

<text x="294.0" y="210" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">điền unit_price</text>
<text x="294.0" y="228" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NEW sửa được</text>
<rect x="404" y="160" width="152" height="88" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="480.0" y="190" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ghi dòng</text>
<text x="480.0" y="210" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">NOT NULL, CHECK, PK</text>
<text x="480.0" y="228" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">giá trị cuối của NEW</text>
<rect x="590" y="160" width="152" height="88" rx="6" fill="#1b1b1d"/><rect x="590" y="160" width="152" height="88" rx="6" fill="rgba(37,193,159,0.10)" stroke="#25c19f" stroke-width="1"/>
<text x="666.0" y="190" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AFTER ROW</text>
<text x="666.0" y="210" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">trừ stock_quantity</text>
<text x="666.0" y="228" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">NEW chỉ đọc</text>
<rect x="776" y="160" width="152" height="88" rx="6" fill="#1b1b1d" stroke="#b4b9c0" stroke-width="1" stroke-dasharray="4,3"/>
<text x="852.0" y="190" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AFTER STATEMENT</text>
<text x="852.0" y="210" fill="#b4b9c0" font-size="10" font-family="'Geist', sans-serif" text-anchor="middle">chạy 1 lần</text>
<text x="852.0" y="228" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bảng chuyển tiếp</text>
<rect x="218" y="300" width="524" height="44" rx="6" fill="#242526" stroke="#e3e3e3" stroke-width="1"/>
<text x="480.0" y="319" fill="#e3e3e3" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lỗi ở bất kỳ bước nào: RAISE EXCEPTION hoặc vi phạm ràng buộc</text>
<text x="480.0" y="335" fill="#b4b9c0" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cả câu INSERT bị hủy, kể cả phần kho đã trừ cho dòng trước</text>
<text x="480" y="380" fill="#b4b9c0" font-size="15" font-family="'Geist', sans-serif" text-anchor="middle">BEFORE ROW trả về NEW thì dòng được ghi; trả về NULL thì dòng bị bỏ qua, không báo lỗi.</text>

</svg>
